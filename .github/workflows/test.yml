name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps
        run: pip install --quiet pytest==9.1.1 ruff==0.17.2 pretty_midi==0.2.11.post0 mido==1.3.3 numpy==2.2.6 flask==3.1.3 reportlab==5.0.0

      - name: Unit tests
        run: pytest -q tests

      - name: Static check (bug-focused rules)
        run: ruff check app scripts tests --select F,E9,W6 --output-format concise
