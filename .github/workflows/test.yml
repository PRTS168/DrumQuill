name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test deps
        run: pip install --quiet pytest ruff pretty_midi mido numpy flask

      - name: Unit tests
        run: pytest -q tests

      - name: Static check (bug-focused rules)
        run: ruff check app scripts tests --select F,E9,W6 --output-format concise
